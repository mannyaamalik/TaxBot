name: Backend CI

on:
  push:
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"
      - ".github/eval-config.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint (ruff) ────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev deps
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── Type check (mypy) ──────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy
        run: mypy api/ generation/ retrieval/ ingestion/ session/ config.py exceptions.py --ignore-missing-imports

  # ── Unit tests (pytest) ────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ \
            --cov=api --cov=generation --cov=retrieval --cov=ingestion --cov=session \
            --cov-report=xml --cov-report=term-missing \
            -v
        env:
          INGEST_API_KEY: test-key-ci
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:11434

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Evaluation (runs against a live server started in-job) ─────────────
  eval:
    name: Evaluation accuracy gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only run on push to main or PRs targeting main (saves CI minutes)
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Read eval thresholds
        id: thresholds
        run: |
          PASS_RATE=$(python3 -c "
          import yaml
          with open('.github/eval-config.yml') as f:
              c = yaml.safe_load(f)
          print(c['pass_rate_threshold'])
          ")
          echo "pass_rate=$PASS_RATE" >> "$GITHUB_OUTPUT"

      - name: Start TaxBot server in background
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          # Wait for /ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && break
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
        env:
          PYTHONPATH: .
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:11434
          INGEST_API_KEY: test-key-ci
          CHROMA_DB_PATH: /tmp/taxbot-eval-chroma
          LOG_LEVEL: WARNING

      - name: Ingest test documents (if any exist in docs/raw/)
        run: |
          if [ -d "docs/raw" ] && [ "$(ls -A docs/raw)" ]; then
            python3 scripts/ingest_bulk.py --dir docs/raw/ --verbose
          else
            echo "No documents in docs/raw/ — skipping ingest (eval questions will return not_found)."
          fi
        env:
          PYTHONPATH: .
          INGEST_API_KEY: test-key-ci
          CHROMA_DB_PATH: /tmp/taxbot-eval-chroma

      - name: Run evaluation
        run: |
          python3 scripts/evaluate.py \
            --server http://localhost:8000 \
            --pass-threshold ${{ steps.thresholds.outputs.pass_rate }} \
            --output eval-results.json
        env:
          PYTHONPATH: .

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-results.json
