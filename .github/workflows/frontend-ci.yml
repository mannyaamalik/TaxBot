name: Frontend CI

on:
  push:
    paths:
      - "taxmitra-web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "taxmitra-web/**"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: taxmitra-web

jobs:
  lint:
    name: Lint (next lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: taxmitra-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: taxmitra-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tsc --noEmit
        run: npx tsc --noEmit

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: taxmitra-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
